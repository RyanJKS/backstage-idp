services:
  backstage:
    build:
      context: .
      target: development
    init: true
    env_file:
      - path: .env.yarn
        format: raw
    environment:
      # Use the Compose database instead of the host's database address.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      APP_CONFIG_app_listen_host: 0.0.0.0
      APP_CONFIG_backend_listen_host: 0.0.0.0
      APP_CONFIG_techdocs_generator_runIn: local
      APP_CONFIG_techdocs_publisher_local_publishDirectory: /app/techdocs
      # Compose injects secrets; prevent Yarn from reloading host addresses.
      YARN_INJECT_ENVIRONMENT_FILES: /dev/null
      YARN_INSTALL_STATE_PATH: /app/node_modules/.yarn-install-state.gz
      YARN_CACHE_FOLDER: /app/node_modules/.yarn-cache
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:7007:7007'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - app_node_modules:/app/packages/app/node_modules
      - backend_node_modules:/app/packages/backend/node_modules
      - techdocs:/app/techdocs
      # Preserve the sibling path used by app-config.local.yaml.
      - type: bind
        source: ../platform-blueprints
        target: /platform-blueprints
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

  postgres:
    image: postgres:17-bookworm
    env_file:
      - path: .env.yarn
        format: raw
    environment:
      POSTGRES_DB: backstage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d backstage']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  node_modules:
  app_node_modules:
  backend_node_modules:
  postgres_data:
  techdocs:
